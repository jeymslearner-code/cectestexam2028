<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CECTESTEXAM 2028</title>
<style>
body {
  font-family: Arial;
  background: #f0f2f5;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
#container {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  width: 90%;
  max-width: 700px;
}
button {
  background: #007bff;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 10px;
}
button:hover {
  background: #0056b3;
}
.timer {
  font-weight: bold;
  color: red;
  float: right;
}
h2 { margin-top: 0; }
</style>
</head>
<body>
<div id="container">
  <h2>ONLINE EXAM</h2>
  <p>Click start to begin. The test will go fullscreen and auto-submit if you exit or time runs out.</p>
  <button id="startBtn">Start Exam</button>
  
  <div id="exam" style="display:none;">
    <div class="timer">Time: <span id="time">20</span>s</div>
    <h3 id="question"></h3>
    <div id="options"></div>
    <button id="nextBtn">Next</button>
  </div>
  
  <p id="result"></p>
</div>

<script>
const questions = [
  // UNIT TEST 1
  {q:"What is the best indicator that you have successfully assembled a computer?",o:["You are able to close the system case cover.","All wires are connected and the lights blink when turned on.","There is a beeping sound as you turn it on.","The PC is able to boot up to the BIOS."],a:3},
  {q:"These are the most common ports used by monitors to produce best video qualities EXCEPT FOR",o:["HDMI","DVI","RPS","VGA"],a:2},
  {q:"These are the most necessary peripherals to run the computer easily.",o:["Speakers, Printer","Keyboard, Mouse, Monitor","Joystick, Headphones, Speakers","Scanner, Mouse, Webcam"],a:1},
  {q:"When installing these, push down properly until you hear a click when the tabs lock.",o:["CPU Fan","CPU","RAM","PSU"],a:2},
  {q:"Where should you clip the anti-static wrist wrap?",o:["Unpainted part of the case","Standoffs of the case","Any screw","I/O Bezel Plate"],a:0},
  // UNIT TEST 2
  {q:"It is a layer of software used to manage computer resources.",o:["Program Applications","Device Drivers","Operating System","BIOS"],a:2},
  {q:"These are small software programs that help the OS use hardware devices.",o:["Drivers","BIOS","Windows","Operating Systems"],a:0},
  {q:"These are several ways in installing device drivers EXCEPT FOR:",o:["Driver Update through Device Manager","None","Manufacturer's DVD Installer","Downloading drivers online","Driverpack Solution"],a:1},
  {q:"When installing an OS, boot files are placed in the:",o:["USB","Flash Drive","RAM","Hard Drive"],a:3},
  {q:"The following are operating systems EXCEPT FOR:",o:["Reaver","MAC OS","Linux","Windows"],a:0},
  {q:"Which of the following is a FREE operating system?",o:["MAC OS","Linux","Reaver","Windows"],a:1}
];

let i=0, score=0, time=20, timer;
const q=document.getElementById('question');
const opt=document.getElementById('options');
const res=document.getElementById('result');
const exam=document.getElementById('exam');
const timeEl=document.getElementById('time');

function showQuestion(){
  if(i>=questions.length){endExam();return;}
  q.textContent=questions[i].q;
  opt.innerHTML='';
  questions[i].o.forEach((c,idx)=>{
    const btn=document.createElement('button');
    btn.textContent=c;
    btn.onclick=()=>{if(idx===questions[i].a)score++;next();};
    opt.appendChild(btn);
    opt.appendChild(document.createElement('br'));
  });
}

function next(){i++;resetTimer();showQuestion();}

function startExam(){
  document.getElementById('startBtn').style.display='none';
  exam.style.display='block';
  goFullscreen();
  showQuestion();
  resetTimer();
}

function resetTimer(){
  clearInterval(timer);
  time=20;
  timeEl.textContent=time;
  timer=setInterval(()=>{
    time--;timeEl.textContent=time;
    if(time<=0)next();
  },1000);
}

function endExam(){
  clearInterval(timer);
  exitFullscreen();
  exam.style.display='none';
  res.textContent=`Exam finished! Your score is ${score}/${questions.length}`;
}

function goFullscreen(){
  if(document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen();
}
function exitFullscreen(){
  if(document.exitFullscreen)
    document.exitFullscreen();
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement)endExam();
});

document.getElementById('startBtn').onclick=startExam;
document.getElementById('nextBtn').onclick=next;
</script>
</body>
</html>
